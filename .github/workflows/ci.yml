name: CI
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: savvy
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/savvy
      DATABASE_URL: postgres://savvy_app:savvy_app@localhost:5432/savvy
    steps:
      - uses: actions/checkout@v4

      # No `version:` here — the action reads pnpm@10.32.1 from package.json's
      # "packageManager" field. Specifying both errors with ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The non-superuser app role isn't created by the service container's
      # init (that only runs for our local docker-compose), so create it here.
      # Without it RLS would be enforced against the wrong role.
      - name: Create non-superuser savvy_app role
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d savvy -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE savvy_app WITH LOGIN PASSWORD 'savvy_app' NOSUPERUSER NOBYPASSRLS;" \
            -c "GRANT CONNECT ON DATABASE savvy TO savvy_app;" \
            -c "GRANT USAGE ON SCHEMA public TO savvy_app;"

      - name: Migrate (schema + RLS policies + grants)
        run: pnpm --filter @savvy/db db:migrate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: savvy
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/savvy
      DATABASE_URL: postgres://savvy_app:savvy_app@localhost:5432/savvy
      AI_STUB_PORT: "4010"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create non-superuser savvy_app role
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d savvy -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE savvy_app WITH LOGIN PASSWORD 'savvy_app' NOSUPERUSER NOBYPASSRLS;" \
            -c "GRANT CONNECT ON DATABASE savvy TO savvy_app;" \
            -c "GRANT USAGE ON SCHEMA public TO savvy_app;"

      - name: Migrate (schema + RLS policies + grants)
        run: pnpm --filter @savvy/db db:migrate

      - name: Install Playwright (chromium)
        run: pnpm --filter @savvy/web exec playwright install --with-deps chromium

      - name: Run e2e (AI stub + Inngest dev + Next + Playwright)
        run: |
          set -e
          # Mock AI gateway (OpenAI-compatible) — never calls a real model.
          node apps/web/tests/e2e/ai-stub.mjs &
          # Inngest dev server executes the durable workflows; retries until the app is up.
          npx --yes inngest-cli@latest dev -u http://localhost:3000/api/inngest --no-discovery &
          sleep 5
          # Fresh isolated tenant for this run.
          pnpm --filter @savvy/web exec tsx tests/e2e/create-tenant.ts
          export TEST_TENANT_ID="$(node -e "console.log(require('/tmp/savvy-e2e-tenant.json').id)")"
          # Isolated demo tenant (full pipeline) for the demo-tenant board spec. Kept out of
          # the shared tenant above so its costed jobs + this-month invoices don't pollute
          # money-console's "GM · MTD est —" assertion. Feeds the second webServer (:3001).
          pnpm --filter @savvy/web exec tsx tests/e2e/seed-demo-tenant.ts
          export DEMO_TENANT_ID="$(node -e "console.log(require('/tmp/savvy-e2e-demo-tenant.json').id)")"
          # Playwright's webServers boot Next on :3000 (shared tenant) + :3001 (demo tenant).
          pnpm --filter @savvy/web exec playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
