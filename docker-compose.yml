services:
  db:
    image: postgres:16
    container_name: savvy_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: savvy
    ports:
      - "5432:5432"
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d
      - savvy_pgdata:/var/lib/postgresql/data
volumes:
  savvy_pgdata:
